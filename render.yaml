services:
  - type: worker
    name: worldcup-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python src/bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1
